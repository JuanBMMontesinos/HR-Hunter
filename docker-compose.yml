# HR Hunter v2.0 — Docker Compose (Frontend Nginx + Backend Express -> Supabase PostgreSQL)
# Note: No local database container (e.g., MSSQL) is needed; all data lives in Supabase via .env.
# Tip: If the Docker host does not support outbound IPv6 routing, set DATABASE_URL in .env to
# your Supabase IPv4 Session Pooler URI instead of direct db.<project_ref>.supabase.co.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hr-hunter-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8081,http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - hr-hunter-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: hr-hunter-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - hr-hunter-net

networks:
  hr-hunter-net:
    driver: bridge
    enable_ipv6: true
